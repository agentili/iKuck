services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikuck
      POSTGRES_PASSWORD: ikuck
      POSTGRES_USER: ikuck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikuck -d ikuck"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./backend
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgres://ikuck:ikuck@postgres:5432/ikuck
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: development-session-secret-not-for-production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
