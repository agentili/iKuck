name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Git ref (branch, tag or SHA)'
        required: true
        default: main
      compose_project:
        description: 'Verified Compose project name on the target host'
        required: true
        type: string
      all_db_workers_quiesced:
        description: 'I verified all image workers sharing this database are quiesced, including other projects and hosts, and will stay stopped through cutover'
        required: true
        type: boolean
        default: false
      cutover_target:
        description: 'Choose fresh only after verifying a fresh target database and no existing image workers'
        required: true
        type: choice
        default: upgrade
        options:
          - upgrade
          - fresh

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Require operator attestation and verified target
        env:
          WORKERS_QUIESCED: ${{ inputs.all_db_workers_quiesced }}
          COMPOSE_PROJECT: ${{ inputs.compose_project }}
          CUTOVER_TARGET: ${{ inputs.cutover_target }}
        run: |
          if [ "$WORKERS_QUIESCED" != true ]; then
            printf '%s\n' 'Operator attestation for all image workers sharing this DB is required.' >&2
            exit 1
          fi
          case "$COMPOSE_PROJECT" in ''|[-_]*|*[!a-z0-9_-]*) exit 1;; esac
          case "$CUTOVER_TARGET" in upgrade|fresh) ;; *) exit 1;; esac
          printf 'COMPOSE_PROJECT=%s\nCUTOVER_TARGET=%s\n' "$COMPOSE_PROJECT" "$CUTOVER_TARGET" >> "$GITHUB_ENV"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            printf '%s\n' "${{ secrets.SSH_PRODUCTION_KEY }}" > ~/.ssh/id_deploy
            TARGET="${{ secrets.SSH_PRODUCTION_USER }}@${{ secrets.SSH_PRODUCTION_HOST }}"
          else
            printf '%s\n' "${{ secrets.SSH_STAGING_KEY }}" > ~/.ssh/id_deploy
            TARGET="${{ secrets.SSH_STAGING_USER }}@${{ secrets.SSH_STAGING_HOST }}"
          fi
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$TARGET" > /tmp/deploy-target.txt

      - name: Deploy disabled-first via SSH
        run: |
          TARGET=$(cat /tmp/deploy-target.txt)
          # Use the existing environment file on the target; do not rewrite it.
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            ENV_FILE=deploy/.env
            COMPOSE_FILE=deploy/docker-compose.production.yml
          else
            ENV_FILE=deploy/.env.standalone
            COMPOSE_FILE=deploy/docker-compose.standalone.yml
          fi
          DEPLOY_SHA=$(git rev-parse HEAD)
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "$TARGET" "
            set -eu
            cd /opt/ikuck
            git fetch origin
            git checkout --detach '$DEPLOY_SHA'
            # Never start a pre-fence API or worker, including as a rollback.
            git grep -Fq 'CREATE FUNCTION public.set_recipe_image_policy_v2()' HEAD -- backend/src/db/migrations/0020_wikimedia_image_consent.sql
            sh deploy/image-cutover.sh all-db-workers-quiesced '$CUTOVER_TARGET' '$COMPOSE_PROJECT' '$ENV_FILE' '$COMPOSE_FILE'
            docker compose -p '$COMPOSE_PROJECT' --env-file '$ENV_FILE' -f '$COMPOSE_FILE' ps
          "

  smoke-test:
    name: Smoke test ${{ github.event.inputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Determine target URL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ secrets.PRODUCTION_BASE_URL }}" >> $GITHUB_ENV
          else
            echo "BASE_URL=${{ secrets.STAGING_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Run smoke test
        run: ./scripts/smoke-test.sh "$BASE_URL" 30
