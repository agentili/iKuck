x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    pids_limit: 200
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - standalone-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 100
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - standalone-redis-data:/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 200
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: ${NODE_ENV:-development}
      RECIPE_PROVIDER: ${RECIPE_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_BUILD_ID: ${VITE_BUILD_ID:-local}
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 100
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ":8080"
    ports:
      - "${IKUCK_PORT:-8080}:8080"
    volumes:
      - standalone-caddy-data:/data
      - standalone-caddy-config:/config

volumes:
  standalone-caddy-config:
  standalone-caddy-data:
  standalone-postgres-data:
  standalone-redis-data:
