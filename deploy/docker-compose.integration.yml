services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikuck_integration
      POSTGRES_PASSWORD: integration
      POSTGRES_USER: integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d ikuck_integration"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55432}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${INTEGRATION_REDIS_PORT:-56379}:6379"
